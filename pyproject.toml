[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-observatory-alan-vo"
version = "1.0.0"
description = "Import structured agent traces, visualize tool-call DAGs, token costs, retries and failure patterns with redacted inputs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
keywords = [
    "ai-agents",
    "observability",
    "trace-analysis",
    "dag-visualization",
    "agent-evaluation",
    "token-cost",
    "redaction"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "authlib>=1.3.1",
    "cryptography>=43.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
